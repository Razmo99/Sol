name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use GitVersion)'
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 LTS for GitVersion
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Install GitVersion 6.4.0
        run: dotnet tool install --global GitVersion.Tool --version 6.4.0

      - name: Verify PowerShell
        run: pwsh --version

      - name: Install required PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          $modules = @('Pester', 'PSScriptAnalyzer', 'ModuleBuilder')
          foreach ($module in $modules) {
            Write-Host "Installing $module..." -ForegroundColor Green
            Install-Module $module -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Get version information
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
            $semver = $version
            Write-Host "Using manual version: $version" -ForegroundColor Green
          } else {
            $gitVersionOutput = dotnet-gitversion | ConvertFrom-Json
            $version = $gitVersionOutput.MajorMinorPatch
            $semver = $gitVersionOutput.SemVer
            Write-Host "Using GitVersion: $version" -ForegroundColor Green
          }
          
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "semver=$semver" >> $env:GITHUB_OUTPUT
          Write-Host "Final version: $version" -ForegroundColor Green
          Write-Host "Final semver: $semver" -ForegroundColor Green

      - name: Run quality checks
        shell: pwsh
        run: |
          Write-Host "Running PSScriptAnalyzer..." -ForegroundColor Green
          $analysisResults = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSGallery -Severity Error
          
          if ($analysisResults) {
            $analysisResults | Format-Table -AutoSize
            throw "PSScriptAnalyzer found errors that must be fixed before release"
          }
          
          Write-Host "PSScriptAnalyzer passed" -ForegroundColor Green

      - name: Build and test module
        shell: pwsh
        run: |
          Write-Host "Building module..." -ForegroundColor Green
          ./build.ps1 -UseGitVersion
          
          Write-Host "Running tests..." -ForegroundColor Green
          $pesterConfig = New-PesterConfiguration
          $pesterConfig.Run.Path = './Tests'
          $pesterConfig.Run.PassThru = $true
          
          $testResult = Invoke-Pester -Configuration $pesterConfig
          
          if ($testResult.FailedCount -gt 0) {
            throw "$($testResult.FailedCount) test(s) failed"
          }
          
          Write-Host "All tests passed" -ForegroundColor Green

      - name: Create module package
        shell: pwsh
        run: |
          Write-Host "Creating module packages..." -ForegroundColor Green
          
          $outputPath = './output'
          $packagePath = './packages'
          New-Item -ItemType Directory -Path $packagePath -Force | Out-Null
          
          # Create ZIP package
          $zipPath = Join-Path $packagePath "Sol-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "$outputPath/*" -DestinationPath $zipPath -Force
          Write-Host "Created ZIP package: $zipPath" -ForegroundColor Green
          
          # Create installation script
          $installScript = @"
          # Sol PowerShell Module Installation Script
          # Version: ${{ steps.version.outputs.version }}
          
          param(
              [string]`$InstallPath = `$null,
              [switch]`$CurrentUser
          )
          
          if (-not `$InstallPath) {
              if (`$CurrentUser) {
                  `$InstallPath = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell/Modules'
              } else {
                  `$InstallPath = Join-Path `$env:ProgramFiles 'PowerShell/Modules'
              }
          }
          
          `$modulePath = Join-Path `$InstallPath 'Sol'
          
          Write-Host "Installing Sol module to: `$modulePath" -ForegroundColor Green
          
          if (Test-Path `$modulePath) {
              Remove-Item `$modulePath -Recurse -Force
          }
          
          New-Item -ItemType Directory -Path `$modulePath -Force | Out-Null
          
          # Extract and copy module files here
          Write-Host "Sol module installed successfully!" -ForegroundColor Green
          Write-Host "Import with: Import-Module Sol" -ForegroundColor Yellow
          "@
          
          $installScript | Out-File -FilePath (Join-Path $packagePath "Install-Sol.ps1") -Encoding UTF8
          
          # List package contents
          Get-ChildItem $packagePath | ForEach-Object {
              Write-Host "Package created: $($_.Name) ($([math]::Round($_.Length/1KB, 2)) KB)" -ForegroundColor Green
          }

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          Write-Host "Generating release notes..." -ForegroundColor Green
          
          # Get commits since last tag
          $lastTag = git describe --tags --abbrev=0 HEAD~1 2>$null
          if ($lastTag) {
            $commits = git log --pretty=format:"- %s (%h)" "$lastTag..HEAD"
            Write-Host "Found commits since $lastTag" -ForegroundColor Green
          } else {
            $commits = git log --pretty=format:"- %s (%h)" HEAD~10..HEAD
            Write-Host "No previous tag found, using last 10 commits" -ForegroundColor Yellow
          }
          
          $releaseNotes = @"
          ## Sol PowerShell Module v${{ steps.version.outputs.version }}
          
          ### Changes in this release:
          $commits
          
          ### Installation
          
          **Option 1: Direct Download**
          1. Download the ``Sol-${{ steps.version.outputs.version }}.zip`` file
          2. Extract to your PowerShell modules directory
          3. Run ``Import-Module Sol``
          
          **Option 2: Using Installation Script**
          1. Download ``Install-Sol.ps1``
          2. Run ``./Install-Sol.ps1 -CurrentUser`` for user installation
          3. Run ``./Install-Sol.ps1`` for system-wide installation (requires admin)
          
          ### Requirements
          - PowerShell 5.1 or later
          - Microsoft Graph PowerShell Module
          - ActiveDirectory PowerShell Module
          - Logging Module
          
          Generated on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          "@
          
          # Save to file for upload
          $releaseNotes | Out-File -FilePath "RELEASE_NOTES.md" -Encoding UTF8
          Write-Host "Release notes generated successfully" -ForegroundColor Green

      - name: Create GitHub Release
        uses: actions/github-script@v7
        id: create_release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const releaseNotes = fs.readFileSync('./RELEASE_NOTES.md', 'utf8');
            
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v${{ steps.version.outputs.version }}',
              name: 'Sol v${{ steps.version.outputs.version }}',
              body: releaseNotes,
              draft: false,
              prerelease: ${{ contains(steps.version.outputs.semver, '-') }}
            });
            
            core.setOutput('release_id', release.data.id);
            core.setOutput('upload_url', release.data.upload_url);
            return release.data.html_url;

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.version }}
          path: |
            ./packages/Sol-${{ steps.version.outputs.version }}.zip
            ./packages/Install-Sol.ps1
            ./RELEASE_NOTES.md
          retention-days: 90

      - name: Attach assets to release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const assets = [
              {
                name: 'Sol-${{ steps.version.outputs.version }}.zip',
                path: './packages/Sol-${{ steps.version.outputs.version }}.zip',
                contentType: 'application/zip'
              },
              {
                name: 'Install-Sol.ps1',
                path: './packages/Install-Sol.ps1',
                contentType: 'text/plain'
              },
              {
                name: 'RELEASE_NOTES.md',
                path: './RELEASE_NOTES.md',
                contentType: 'text/markdown'
              }
            ];
            
            for (const asset of assets) {
              const data = fs.readFileSync(asset.path);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ steps.create_release.outputs.release_id }},
                name: asset.name,
                data: data,
                headers: {
                  'content-type': asset.contentType,
                  'content-length': data.length
                }
              });
            }

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './packages/Sol-${{ steps.version.outputs.version }}.zip'