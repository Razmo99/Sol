name: Continuous Integration
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and Test PowerShell Module (PS ${{ matrix.powershell-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        powershell-version: ['5.1', '7.x']
    
    outputs:
      version: ${{ steps.setup-and-test.outputs.version }}
      semver: ${{ steps.setup-and-test.outputs.semver }}
      nugetVersion: ${{ steps.setup-and-test.outputs.nugetVersion }}
      informationalVersion: ${{ steps.setup-and-test.outputs.informationalVersion }}
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion to calculate version from history
      
      - name: Setup and Test Module
        id: setup-and-test
        uses: ./.github/actions/setup-and-test
        with:
          powershell-version: ${{ matrix.powershell-version }}
          run-tests: 'true'
          build-module: 'true'
          analyzer-severity: 'Error,Warning'  # Can be set to 'none' to skip PSScriptAnalyzer
          test-path: 'Tests'
          code-coverage: 'true'
          code-coverage-path: 'output'
          test-report-name: 'Test Results - PS ${{ matrix.powershell-version }}'
          test-report-title: 'PowerShell ${{ matrix.powershell-version }} Test Results'
      
      # Optional: Display test summary in job summary
      - name: Test Summary
        if: always()
        run: |
          Write-Host "## PowerShell ${{ matrix.powershell-version }} Results" -ForegroundColor Cyan
          Write-Host "Version: ${{ steps.setup-and-test.outputs.version }}"
          Write-Host "SemVer: ${{ steps.setup-and-test.outputs.semver }}"
          Write-Host "Tests Passed: ${{ steps.setup-and-test.outputs.tests-passed }}"
          Write-Host "Tests Failed: ${{ steps.setup-and-test.outputs.tests-failed }}"
        shell: pwsh