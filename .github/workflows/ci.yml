name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and Test PowerShell Module
    runs-on: windows-latest
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
      semver: ${{ steps.gitversion.outputs.semver }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 LTS for GitVersion
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install GitVersion 5.12.0
        run: dotnet tool install --global GitVersion.Tool --version 5.12.0

      - name: Install required PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          $modules = @(
            'Pester', 
            'PSScriptAnalyzer', 
            'ModuleBuilder', 
            'Logging'
          )
          foreach ($module in $modules) {
              Write-Host "Installing $module..." -ForegroundColor Green
              Install-Module $module -Force -SkipPublisherCheck
          }

      - name: Get version from GitVersion
        id: gitversion
        run: |
          Write-Host "Running GitVersion..." -ForegroundColor Green
          
          # Get GitVersion output as JSON
          $gitVersionRaw = dotnet-gitversion
          Write-Host "GitVersion output (first 500 chars):" -ForegroundColor Yellow
          Write-Host ($gitVersionRaw | Out-String).Substring(0, [Math]::Min(500, $gitVersionRaw.Length))
          
          try {
            $gitVersionOutput = $gitVersionRaw | ConvertFrom-Json
            $version = $gitVersionOutput.MajorMinorPatch
            $semver = $gitVersionOutput.SemVer
            Write-Host "Successfully parsed GitVersion output" -ForegroundColor Green
          } catch {
            Write-Warning "GitVersion output could not be parsed as JSON. Using fallback version."
            Write-Host "Error: $_" -ForegroundColor Red
            $version = "0.1.0"
            $semver = "0.1.0-ci.${{ github.run_number }}"
          }
          
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "semver=$semver" >> $env:GITHUB_OUTPUT
          Write-Host "Final Version: $version" -ForegroundColor Green
          Write-Host "Final SemVer: $semver" -ForegroundColor Green
        shell: pwsh

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Running PSScriptAnalyzer..." -ForegroundColor Green
          $analysisResults = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSGallery -Severity @('Error', 'Warning')
          
          if ($analysisResults) {
            $analysisResults | Format-Table -AutoSize
            $errorCount = ($analysisResults | Where-Object Severity -eq 'Error').Count
            $warningCount = ($analysisResults | Where-Object Severity -eq 'Warning').Count
            
            Write-Host "PSScriptAnalyzer found $errorCount error(s) and $warningCount warning(s)" -ForegroundColor $(if($errorCount -gt 0) {'Red'} else {'Yellow'})
            
            if ($errorCount -gt 0) {
              throw "PSScriptAnalyzer found $errorCount error(s) that must be fixed"
            }
          } else {
            Write-Host "PSScriptAnalyzer found no issues" -ForegroundColor Green
          }

      - name: Build module
        shell: pwsh
        run: |
          Write-Host "Building module with GitVersion..." -ForegroundColor Green
          ./build.ps1 -UseGitVersion

      - name: Run Pester tests
        shell: powershell
        run: |
          Write-Host "Running Pester tests on PowerShell 5.1..." -ForegroundColor Green
          Write-Host "Module version: ${{ steps.gitversion.outputs.version }}" -ForegroundColor Cyan
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)" -ForegroundColor Yellow
          
          # Debug: Check if Logging module is available
          Write-Host "Debugging Logging module availability..." -ForegroundColor Yellow
          try {
            Import-Module Logging -Force -ErrorAction Stop
            Write-Host "Logging module imported successfully" -ForegroundColor Green
            Get-Module Logging | Format-List Name, Version, Path
          } catch {
            Write-Warning "Failed to import Logging module: $_"
            Write-Host "Available modules:" -ForegroundColor Yellow
            Get-Module -ListAvailable | Where-Object Name -like "*Log*" | Format-Table Name, Version, ModuleBase
          }
          
          # Verify module exists and can be imported
          Write-Host "Checking module availability..." -ForegroundColor Green
          if (Test-Path './output/sol/sol.psd1') {
            Write-Host "Module manifest found" -ForegroundColor Green
            try {
              Import-Module './output/sol' -Force -ErrorAction Stop
              Write-Host "Module imported successfully" -ForegroundColor Green
              Remove-Module sol -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Warning "Module import test failed: $_"
            }
          } else {
            Write-Warning "Module manifest not found at ./output/sol/sol.psd1"
            Get-ChildItem ./output -Recurse | Select-Object FullName
          }
          
          # Run tests with error handling
          try {
            # Use simpler Pester configuration for PowerShell 5.1 compatibility
            $testResult = Invoke-Pester -Path './Tests' -PassThru -Show All
            
            Write-Host "Test Summary:" -ForegroundColor Green
            Write-Host "  Total: $($testResult.TotalCount)" -ForegroundColor White
            Write-Host "  Passed: $($testResult.PassedCount)" -ForegroundColor Green
            Write-Host "  Failed: $($testResult.FailedCount)" -ForegroundColor $(if($testResult.FailedCount -gt 0) {'Red'} else {'Green'})
            Write-Host "  Skipped: $($testResult.SkippedCount)" -ForegroundColor Yellow
            
            if ($testResult.FailedCount -gt 0) {
              throw "$($testResult.FailedCount) test(s) failed"
            }
          } catch {
            Write-Host "Pester execution failed: $_" -ForegroundColor Red
            throw
          }

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-module-${{ steps.gitversion.outputs.semver }}
          path: output/
          retention-days: 90
          compression-level: 6

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-ps5.1-${{ github.run_id }}
          path: |
            testResults.xml
            coverage.xml
          retention-days: 30
          compression-level: 6
          include-hidden-files: false

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PSScriptAnalyzer security scan
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSGallery -ReportSummary
          if ($results) {
            Write-Host "Security issues found:" -ForegroundColor Red
            $results | Where-Object Severity -eq 'Error' | Format-Table -AutoSize
            exit 1
          }
          Write-Host "No security issues found" -ForegroundColor Green