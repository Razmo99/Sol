name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and Test PowerShell Module (PS ${{ matrix.powershell-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        powershell-version: ['5.1', '7.x']
    outputs:
      version: ${{ steps.setup-and-test.outputs.version }}
      semver: ${{ steps.setup-and-test.outputs.semver }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup and Test Module
        id: setup-and-test
        uses: ./.github/actions/setup-and-test
        with:
          powershell-version: ${{ matrix.powershell-version }}
          run-tests: 'true'
          build-module: 'true'