name: 'Setup and Test PowerShell Module'
description: 'Common setup and testing steps for PowerShell module CI/CD with GitTools, RequiredModules pattern, and enhanced Pester reporting'

inputs:
  powershell-version:
    description: 'PowerShell version to use'
    required: false
    default: '7.x'
  run-tests:
    description: 'Whether to run Pester tests'
    required: false
    default: 'true'
  build-module:
    description: 'Whether to build the module'
    required: false
    default: 'true'
  analyzer-severity:
    description: 'PSScriptAnalyzer severity level'
    required: false
    default: 'Error,Warning'
  test-path:
    description: 'Path to Pester tests'
    required: false
    default: 'Tests'
  code-coverage:
    description: 'Enable code coverage'
    required: false
    default: 'true'
  code-coverage-path:
    description: 'Path to source files for code coverage'
    required: false
    default: 'Source'
  test-report-name:
    description: 'Name for the test report'
    required: false
    default: 'Test Results'
  test-report-title:
    description: 'Title for the test report'
    required: false
    default: 'PowerShell Module Tests'
  required-modules-path:
    description: 'Path to RequiredModules.psd1 file'
    required: false
    default: './RequiredModules.psd1'
  cache-modules:
    description: 'Whether to cache PowerShell modules'
    required: false
    default: 'true'

outputs:
  version:
    description: 'Version from GitVersion'
    value: ${{ steps.gitversion.outputs.majorMinorPatch }}
  semver:
    description: 'Semantic version from GitVersion'
    value: ${{ steps.gitversion.outputs.semVer }}
  nugetVersion:
    description: 'NuGet version'
    value: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
  informationalVersion:
    description: 'Full informational version'
    value: ${{ steps.gitversion.outputs.informationalVersion }}
  test-results-path:
    description: 'Path to test results file'
    value: ${{ steps.test-report.outputs.test_results_path }}
  tests-passed:
    description: 'Number of tests passed'
    value: ${{ steps.test-report.outputs.passed_count }}
  tests-failed:
    description: 'Number of tests failed'
    value: ${{ steps.test-report.outputs.failed_count }}

runs:
  using: 'composite'
  steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '5.x'
        
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true
        configFilePath: ./GitVersion.yml
        
    # Optional: Only display in debug mode
    - name: Display version (Debug)
      shell: bash
      if: runner.debug == '1'
      run: |
        echo "::group::GitVersion Output"
        echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
        echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
        echo "NuGetVersionV2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"
        echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
        echo "BranchName: ${{ steps.gitversion.outputs.branchName }}"
        echo "::endgroup::"

    # Simple PowerShell module installation
    - name: Install Required PowerShell Modules
      shell: pwsh
      run: |
        Write-Host "Installing required PowerShell modules..." -ForegroundColor Green
        Set-PSRepository PSGallery -InstallationPolicy Trusted
        
        # Note: Pester is automatically installed by the zyborg action
        # Only need to install modules not handled by other actions
        $modules = @('ModuleBuilder', 'Logging')
        
        foreach ($module in $modules) {
            Write-Host "Installing $module..." -ForegroundColor Green
            Install-Module $module -Force -SkipPublisherCheck -AllowClobber
        }

    # Run PSScriptAnalyzer using official Microsoft action
    - name: Run PSScriptAnalyzer
      if: inputs.analyzer-severity != 'none'
      uses: microsoft/psscriptanalyzer-action@v1.0
      with:
        path: .
        recurse: true
        output: pssa-results.sarif
        settings: ${{ hashFiles('PSScriptAnalyzerSettings.psd1') != '' && 'PSScriptAnalyzerSettings.psd1' || '' }}
        
    # Upload SARIF results to GitHub for code scanning
    - name: Upload SARIF results
      if: always() && inputs.analyzer-severity != 'none'
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: pssa-results.sarif

    # Build module before testing
    - name: Build module
      shell: pwsh
      if: inputs.build-module == 'true'
      env:
        GITVERSION_MAJORMINORPATCH: ${{ steps.gitversion.outputs.majorMinorPatch }}
        GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        GITVERSION_NUGETVERSION: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
        GITVERSION_INFORMATIONALVERSION: ${{ steps.gitversion.outputs.informationalVersion }}
        GITVERSION_ASSEMBLYSEMVER: ${{ steps.gitversion.outputs.assemblySemVer }}
        GITVERSION_ASSEMBLYSEMFILEVER: ${{ steps.gitversion.outputs.assemblySemFileVer }}
      run: |
        Write-Host "Building module version: $env:GITVERSION_SEMVER" -ForegroundColor Green
        
        # Check for build script
        if (Test-Path ./build.ps1) {
            # Run build script with common parameters
            $buildParams = @{}
            
            # Add version parameter if the script accepts it
            $buildScript = Get-Command ./build.ps1
            if ($buildScript.Parameters.ContainsKey('Version')) {
                $buildParams['Version'] = $env:GITVERSION_SEMVER
            }
            
            ./build.ps1 @buildParams
        } elseif (Test-Path ./Source/*.psd1) {
            # Use ModuleBuilder directly if no build script exists
            Write-Host "Using ModuleBuilder to compile module" -ForegroundColor Yellow
            
            $moduleName = (Get-ChildItem ./Source/*.psd1 | Select-Object -First 1).BaseName
            Build-Module -SourcePath "./Source/$moduleName.psd1" -OutputDirectory ./Output -Version $env:GITVERSION_SEMVER
        } else {
            Write-Warning "No build.ps1 or Source/*.psd1 found, skipping build step"
        }

    # Use zyborg's pester-tests-report for rich test reporting
    - name: Run Pester tests with reporting
      id: test-report